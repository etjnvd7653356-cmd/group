<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课题组药品查询 | Lab Drug Database</title>
<style>
:root {
  --primary:#174d45; --primary-light:#247869; --bg:#f4f6f3; --card-bg:#fff;
  --text:#243831; --text-light:#6e7b73; --border:#dfe6df; --tag-bg:#edf5ef;
  --tag-text:#35614e; --row-hover:#f8fbf7; --shadow:0 3px 18px #203f2f05;
  --shadow-lg:0 24px 90px #142d2833;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:var(--bg); line-height:1.5; -webkit-font-smoothing:antialiased; }
button,input,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible { outline:3px solid #8bbdb0; outline-offset:3px; }
.header { background:#fff; border-bottom:1px solid var(--border); }
.header-inner { max-width:1440px; margin:auto; padding:20px 40px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.brand { display:flex; gap:13px; align-items:center; }
.brand-mark { width:44px; height:46px; background:var(--primary); color:white; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:26px; line-height:1; flex-shrink:0; }
.brand-mark span { font:8px "Segoe UI",sans-serif; letter-spacing:3px; margin:3px 0 0 3px; }
.brand-caption { font-size:9px; letter-spacing:2px; color:#87958a; margin-bottom:4px; }
.header h1 { font-size:17px; font-weight:650; letter-spacing:.02em; }
.header-right { display:flex; align-items:center; gap:22px; }
.header-stats { font-size:12px; color:var(--text-light); white-space:nowrap; }
.lang-toggle { display:flex; gap:3px; background:#f0f3ef; border:1px solid #e8ede7; border-radius:9px; padding:3px; }
.lang-toggle button { border:0; background:transparent; color:var(--text-light); padding:6px 12px; font-size:12px; border-radius:6px; }
.lang-toggle button.active { color:var(--primary); background:white; box-shadow:0 1px 4px #244a2420; }
.main { max-width:1440px; margin:auto; padding:38px 40px 40px; }
.hero { display:flex; justify-content:space-between; align-items:center; gap:24px; margin-bottom:28px; }
.eyebrow { font-size:11px; letter-spacing:2px; color:#6d887a; margin-bottom:12px; }
.hero h2 { font-size:36px; letter-spacing:-1px; font-weight:650; line-height:1.3; margin-bottom:10px; }
.hero-description { font-size:14px; color:var(--text-light); }
.update-stamp { color:#567564; font-size:12px; white-space:nowrap; border:1px solid #dce6db; background:#edf3e9; border-radius:30px; padding:9px 14px; }
.update-stamp::before { content:""; display:inline-block; width:6px; height:6px; margin-right:8px; border-radius:50%; background:#59836b; }
.stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:28px; }
.stat-card { border:1px solid var(--border); border-radius:14px; padding:19px 23px; background:white; position:relative; }
.stat-label { font-size:12px; color:var(--text-light); }
.stat-value { display:block; font-size:34px; font-weight:600; letter-spacing:-1px; margin:7px 0 0; font-variant-numeric:tabular-nums; line-height:1.3; }
.stat-caption { font-size:11px; color:#8b968e; margin-top:5px; }
.stat-card:first-child { background:#194f46; border-color:#194f46; color:white; }
.stat-card:first-child .stat-label,.stat-card:first-child .stat-caption { color:#b6cec4; }
.stat-card.review { background:#fffaf0; border-color:#eaddc5; }
.stat-card.review .stat-value { color:#9c6829; }
.search-panel { padding:23px 24px 18px; border:1px solid var(--border); border-radius:14px 14px 0 0; background:white; }
.section-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:17px; }
.section-heading h3 { font-size:15px; font-weight:600; }
.shortcut { color:#8c978f; font-size:11px; }
kbd { display:inline-block; border:1px solid #dfe5df; border-bottom:2px solid #dfe5df; border-radius:5px; padding:1px 5px; font-family:inherit; font-size:11px; margin-left:4px; }
.search-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.search-input { flex:1; min-width:240px; padding:12px 15px; border:1px solid #d8e1d8; border-radius:9px; font-size:14px; color:var(--text); background:#fafcf9; transition:.15s; }
.search-input:focus { border-color:#7b9e8e; background:white; outline:none; box-shadow:0 0 0 3px #e5efe8; }
.search-input::placeholder { color:#8c998e; }
.filter-select { padding:12px; border:1px solid var(--border); border-radius:9px; font-size:13px; color:#426152; min-width:180px; max-width:260px; background:white; }
.review-filter { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-light); padding:0 5px; }
.review-filter input { width:15px; height:15px; accent-color:var(--primary); cursor:pointer; }
.btn { padding:11px 18px; font-size:13px; border-radius:9px; border:1px solid var(--border); color:#4e695b; background:white; }
.btn:hover { background:#edf4ed; }
.result-info { color:#7a897e; font-size:12px; margin-top:18px; }
.result-info strong { color:#345f4d; font-weight:600; }
.inventory-note { border:1px solid #e1e7dc; border-radius:10px; color:#778171; font-size:11px; line-height:1.9; padding:11px 15px; margin-top:22px; background:#eef2e9; }
.table-container { background:white; border:1px solid var(--border); border-top:0; border-radius:0 0 14px 14px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead th { padding:13px 24px; text-align:left; background:#f5f8f3; color:#829080; font-size:11px; font-weight:500; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
thead th:first-child { width:70px; }
thead th:nth-child(2) { width:49%; }
thead th:nth-child(3) { width:21%; }
thead th:hover { color:var(--primary); }
.sort-icon { margin-left:7px; font-size:8px; }
tbody td { padding:15px 24px; border-bottom:1px solid #eef1ec; vertical-align:middle; font-size:13px; }
tbody tr:last-child td { border-bottom:0; }
tbody tr { transition:background .12s; }
tbody tr:hover { background:var(--row-hover); }
tbody td:first-child { color:#a3ada4; font-size:11px; font-variant-numeric:tabular-nums; }
.name-cell { font-weight:500; max-width:560px; overflow-wrap:anywhere; }
.name-cell.no-cas { font-style:normal; color:var(--text); }
.name-cn { font-size:14px; }
.name-en { display:block; color:#8d998f; font-size:11px; font-weight:400; margin-top:3px; }
.cas-cell { font-family:"Cascadia Code",Consolas,monospace; color:#446451; font-size:12px; white-space:nowrap; }
.loc-tag { display:inline-block; padding:4px 9px; border:1px solid #dce8dd; background:#eff6ef; border-radius:6px; font-size:11px; color:#567459; white-space:nowrap; }
.sub-location { display:block; font-size:11px; color:#909b90; margin-top:5px; }
.review-note { display:block; font-size:10px; font-weight:400; color:#a5783b; margin-top:7px; }
.review-note::before { content:""; display:inline-block; width:5px; height:5px; background:#d2ad71; border-radius:50%; margin-right:5px; vertical-align:middle; }
.pagination { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:22px; }
.pagination button { padding:7px 11px; min-width:34px; border:1px solid #dfe5dd; border-radius:7px; color:#73816f; background:white; font-size:12px; }
.pagination button.active { background:var(--primary); border-color:var(--primary); color:white; }
.pagination button:hover:not(:disabled):not(.active) { background:#e8f0e6; }
.pagination button:disabled { opacity:.4; cursor:default; }
.empty { text-align:center; padding:55px 20px; background:white; color:#869583; font-size:14px; }
.empty-icon { font-size:30px; margin-bottom:12px; }
.modal-overlay { display:none; position:fixed; inset:0; background:#152e2966; backdrop-filter:blur(5px); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:white; border-radius:20px; width:100%; max-width:620px; max-height:85vh; overflow-y:auto; padding:30px; box-shadow:var(--shadow-lg); }
.modal h3 { font-size:21px; padding-right:25px; margin-bottom:22px; font-weight:600; overflow-wrap:anywhere; }
.modal-field { margin-bottom:15px; border-bottom:1px solid #edf1ea; padding-bottom:13px; font-size:13px; }
.modal-field:last-child { border-bottom:0; }
.modal-field label { display:block; color:#91a08e; font-size:10px; margin-bottom:5px; }
.modal-field span { overflow-wrap:anywhere; }
.modal-close { float:right; border:0; background:#f1f5ef; color:#788b75; width:29px; height:29px; border-radius:50%; font-size:23px; line-height:1; }
.source-list { font-size:11px; color:#788774; line-height:1.9; padding-left:16px; overflow-wrap:anywhere; }
.site-footer { text-align:center; color:#a0aaa0; font-size:10px; margin-top:26px; letter-spacing:.04em; }
@media(min-width:1100px) { .table-container { min-height:400px; } }
@media(max-width:1000px) { .header-inner,.main { padding-left:24px; padding-right:24px; } .header-stats { display:none; } .review-filter { order:4; width:100%; padding-top:5px; } .hero h2 { font-size:30px; } }
@media(max-width:640px) {
  .header-inner { padding:16px; gap:12px; } .header h1 { font-size:13px; max-width:190px; } .brand-caption { font-size:7px; letter-spacing:1px; } .brand { gap:9px; } .brand-mark { width:35px; height:39px; font-size:22px; border-radius:9px; }
  .lang-toggle button { font-size:10px; padding:5px 7px; } .main { padding:26px 14px; }
  .hero { align-items:flex-start; flex-direction:column; gap:13px; margin-bottom:20px; } .hero h2 { font-size:29px; } .hero-description { font-size:12px; } .update-stamp { font-size:10px; padding:5px 10px; }
  .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-bottom:20px; } .stat-card { padding:14px 16px; border-radius:11px; } .stat-value { font-size:28px; } .stat-label { font-size:11px; } .stat-caption { font-size:10px; }
  .search-panel { padding:18px 14px; } .search-input { flex:1 1 100%; min-width:0; } .filter-select { flex:1; max-width:none; min-width:0; } .shortcut { display:none; }
  table { min-width:650px; } thead th,tbody td { padding:13px 15px; } .inventory-note { font-size:10px; } .modal { padding:24px 20px; } .modal h3 { font-size:18px; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

<header class="header">
  <div class="header-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true">G<span>LAB</span></div><div><div class="brand-caption">LABORATORY INVENTORY</div><h1 data-cn="高俊阔课题组药品查询系统" data-en="Gao Junkou Lab Drug Database"></h1></div></div>
    <div class="header-right">

      <div class="lang-toggle" id="langToggle">
        <button data-lang="cn" class="active">中文</button>
        <button data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <section class="hero">
    <div><p class="eyebrow">GAO GROUP / REAGENT DIRECTORY</p><h2 id="heroTitle"></h2><p class="hero-description" id="heroDescription"></p></div>
    <div class="update-stamp" id="updateStamp"></div>
  </section>
  <section class="stats-grid" aria-label="Inventory overview">
    <div class="stat-card"><span class="stat-label" id="totalLabel"></span><strong class="stat-value" id="totalMetric"></strong><p class="stat-caption" id="totalCaption"></p></div>
    <div class="stat-card"><span class="stat-label" id="locationsLabel"></span><strong class="stat-value" id="locationsMetric"></strong><p class="stat-caption" id="locationsCaption"></p></div>
    <div class="stat-card"><span class="stat-label" id="newLabel"></span><strong class="stat-value" id="newMetric"></strong><p class="stat-caption" id="newCaption"></p></div>
    <div class="stat-card review"><span class="stat-label" id="reviewLabel"></span><strong class="stat-value" id="reviewMetric"></strong><p class="stat-caption" id="reviewCaption"></p></div>
  </section>
  <section class="search-panel">
    <div class="section-heading"><h3 id="searchHeading"></h3><span class="shortcut" id="shortcutHint"></span></div>
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" aria-label="搜索药品名称或CAS / Search reagent or CAS"
      data-cn-placeholder="搜索药品名称、CAS号…"
      data-en-placeholder="Search drug name, CAS number..."
      autofocus>
    <select class="filter-select" id="locationFilter" aria-label="存放位置 / Storage location">
      <option value="" data-cn="全部位置" data-en="All Locations"></option>
    </select>
    <label class="review-filter"><input type="checkbox" id="reviewFilter"><span id="reviewFilterLabel"></span></label>
    <button class="btn btn-outline" id="resetBtn" data-cn="重置" data-en="Reset"></button>
  </div>

  <div class="result-info" id="resultInfo"></div>

  </section>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="id" style="width:50px">#<span class="sort-icon"></span></th>
          <th data-sort="name" data-cn="药品名称" data-en="Drug Name"><span class="sort-icon"></span></th>
          <th data-sort="cas">CAS<span class="sort-icon"></span></th>
          <th data-sort="location" data-cn="存放位置" data-en="Location"><span class="sort-icon"></span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🔍</div>
    <p data-cn="没有找到匹配的药品" data-en="No matching drugs found"></p>
  </div>

  <div class="pagination" id="pagination"></div>
<div class="inventory-note" id="inventoryNote"></div><footer class="site-footer">GAO GROUP · LABORATORY INVENTORY</footer>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="关闭详情 / Close details">&times;</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

function translateLoc(cn) { return (currentLang === 'en' && locMap[cn]) ? locMap[cn] : cn; }

// ── Load data ──
function loadData() {
  drugs = DRUG_DATA;
  filteredDrugs = [...drugs];
  initLocationFilter();
  applyAll();
  updateLangUI();
}

function initLocationFilter() {
  const locs = [...new Set(drugs.map(d => d.location))].sort();
  const sel = document.getElementById('locationFilter');
  const selectedLocation = sel.value;
  sel.innerHTML = ''; // clear
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = i18n[currentLang].allLocations;
  sel.appendChild(allOpt);
  locs.forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc;
    opt.textContent = translateLoc(loc);
    sel.appendChild(opt);
  });
  if (locs.includes(selectedLocation)) sel.value = selectedLocation;
}

// ── Search ──
function matchesSearch(drug, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  if (drug.name.toLowerCase().includes(q)) return true;
  if ((drug.name_en||'').toLowerCase().includes(q)) return true;
  if (drug.cas.toLowerCase().includes(q)) return true;
  if (drug.location.toLowerCase().includes(q)) return true;
  if ((drug.sublocation || '').toLowerCase().includes(q)) return true;
  if ((drug.cas_candidate || '').toLowerCase().includes(q)) return true;
  if ((drug.sources || []).some(s => s.cells.some(c => c.toLowerCase() === q))) return true;
  if ((locMap[drug.location]||'').toLowerCase().includes(q)) return true;
  return false;
}

// ── Sort ──
function sortDrugs(list, field, asc) {
  return [...list].sort((a, b) => {
    let va = field === 'id' ? a.id : (a[field] || '').toString().toLowerCase();
    let vb = field === 'id' ? b.id : (b[field] || '').toString().toLowerCase();
    if (field === 'id') { va = Number(va); vb = Number(vb); }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
}

// ── Render ──
function render() {
  const start = (currentPage - 1) * pageSize;
  const page = filteredDrugs.slice(start, start + pageSize);
  const tbody = document.getElementById('tableBody');

  if (page.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
  } else {
    document.getElementById('emptyState').style.display = 'none';
    tbody.innerHTML = page.map(d => {
      const cn = esc(d.name);
      const en = d.name_en ? `<span class="name-en">${esc(d.name_en)}</span>` : '';
      const nameHtml = currentLang === 'en'
        ? (d.name_en ? `<span class="name-en" style="font-size:.95rem;color:var(--text)">${esc(d.name_en)}</span><span class="name-en">${esc(d.name)}</span>` : `<span class="name-cn">${cn}</span>`)
        : `<span class="name-cn">${cn}</span>${en}`;
      return `
      <tr data-id="${d.id}" style="cursor:pointer" tabindex="0" onclick="showDetail(${d.id})" onkeydown="if(event.key==='Enter'){showDetail(${d.id})}">
        <td>${d.id}</td>
        <td class="name-cell${d.cas ? '' : ' no-cas'}">${nameHtml}${d.issues?.length ? `<span class="review-note">${currentLang === 'en' ? 'Needs review' : '待核对'}：${esc(d.issues[0])}${d.issues.length > 1 ? (currentLang === 'en' ? ` · ${d.issues.length} notes` : ` · 共${d.issues.length}项`) : ''}</span>` : ''}</td>
        <td class="cas-cell">${esc(d.cas || '—')}</td>
        <td><span class="loc-tag">${esc(translateLoc(d.location))}</span>${d.sublocation ? `<span class="sub-location">${esc(d.sublocation)}</span>` : ''}</td>
      </tr>`;
    }).join('');
    renderPagination();
  }

  const t = i18n[currentLang];
  document.getElementById('headerStats').textContent =
    t.headerDrugCount.replace('{n}', drugs.length);
  document.getElementById('resultInfo').innerHTML =
    filteredDrugs.length !== drugs.length
      ? t.resultFiltered.replace('{f}', filteredDrugs.length).replace('{t}', drugs.length)
      : t.resultAll.replace('{n}', drugs.length);

  document.querySelectorAll('thead th').forEach(th => {
    const field = th.dataset.sort;
    const icon = th.querySelector('.sort-icon');
    if (field === currentSort.field) {
      icon.textContent = currentSort.asc ? '▲' : '▼';
    } else { icon.textContent = ''; }
  });
}

function renderPagination() {
  const totalPages = Math.ceil(filteredDrugs.length / pageSize);
  const container = document.getElementById('pagination');
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  const t = i18n[currentLang];
  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">${t.prev}</button>`;
  const maxBtns = 7;
  let startPage = Math.max(1, currentPage - Math.floor(maxBtns / 2));
  let endPage = Math.min(totalPages, startPage + maxBtns - 1);
  if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);
  if (startPage > 1) {
    html += `<button onclick="goPage(1)">1</button>`;
    if (startPage > 2) html += '<button disabled>…</button>';
  }
  for (let p = startPage; p <= endPage; p++) {
    html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
  }
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += '<button disabled>…</button>';
    html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
  }
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">${t.next}</button>`;
  container.innerHTML = html;
}

function goPage(p) { currentPage = p; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ── Modal ──
function showDetail(id) {
  const d = drugs.find(x => x.id === id);
  if (!d) return;
  const t = i18n[currentLang];
  const title = currentLang === 'en' && d.name_en ? d.name_en : d.name;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-field"><label>${t.modalCas}</label><span class="cas-cell">${esc(d.cas || t.modalNoCas)}</span></div>
    <div class="modal-field"><label>${t.modalLocation}</label><span>${esc(translateLoc(d.location))}</span></div>
    <div class="modal-field"><label>${t.modalId}</label><span>#${d.id}</span></div>
    ${d.sublocation ? detailField('具体列位 / Column', d.sublocation) : ''}
    ${d.cas_candidate ? detailField('日期型CAS候选（待核对） / Candidate only', d.cas_candidate) : ''}
    ${d.issues?.length ? detailField('待核对事项 / Needs review', d.issues.join('；')) : ''}
    ${d.notes?.length ? detailField('解析说明 / Import notes', d.notes.join('；')) : ''}
    ${d.source_file ? detailField('来源清单 / Source', d.source_file) : detailField('来源 / Source', '历史保留记录 / Retained record')}
    ${d.sources?.length ? `<div class="modal-field"><label>原表坐标及内容 / Original cells</label><ul class="source-list">${d.sources.map(s => `<li>${esc(s.sheet)}!${esc(s.cells.join(', '))}：${esc(s.values.join(' / '))}</li>`).join('')}</ul></div>` : ''}
    ${d.occurrences > 1 ? detailField('原表出现次数（非瓶数） / Source occurrences', String(d.occurrences)) : ''}
    ${currentLang === 'cn' && d.name_en ? `<div class="modal-field"><label>English Name</label><span>${esc(d.name_en)}</span></div>` : ''}
    ${currentLang === 'en' ? `<div class="modal-field"><label>中文名</label><span>${esc(d.name)}</span></div>` : ''}
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

document.getElementById('modalClose').onclick = () =>
  document.getElementById('modalOverlay').classList.remove('show');
document.getElementById('modalOverlay').onclick = e => {
  if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('show');
};

function detailField(label, value) {
  return `<div class="modal-field"><label>${esc(label)}</label><span>${esc(value)}</span></div>`;
}

// ── Apply ──
function applyAll() {
  const query = document.getElementById('searchInput').value.trim();
  const loc = document.getElementById('locationFilter').value;
  filteredDrugs = drugs.filter(d => {
    if (loc && d.location !== loc) return false;
    if (document.getElementById('reviewFilter').checked && !d.issues?.length) return false;
    if (!matchesSearch(d, query)) return false;
    return true;
  });
  filteredDrugs = sortDrugs(filteredDrugs, currentSort.field, currentSort.asc);
  currentPage = 1;
  render();
}

// ── Events ──
document.getElementById('reviewFilter').addEventListener('change', applyAll);
document.getElementById('searchInput').addEventListener('input', applyAll);
document.getElementById('locationFilter').addEventListener('change', applyAll);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('reviewFilter').checked = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('locationFilter').value = '';
  applyAll();
});

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (currentSort.field === field) currentSort.asc = !currentSort.asc;
    else { currentSort.field = field; currentSort.asc = true; }
    filteredDrugs = sortDrugs(filteredDrugs, currentSort.field, currentSort.asc);
    currentPage = 1;
    render();
  });
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show');
});

// ── Language toggle ──
document.querySelectorAll('#langToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('#langToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateLangUI();
    initLocationFilter();
    applyAll();
  });
});

function updateLangUI() {
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
  document.getElementById('reviewFilterLabel').textContent = currentLang === 'en' ? 'New inventory: needs review' : '仅看新清单待核对项';
  const reviewCount = drugs.filter(d => d.issues?.length).length;
  document.getElementById('inventoryNote').textContent = currentLang === 'en'
    ? `Updated 2026-10-28. Ligand shelves 1–5 and metal shelf 1 use the new stocktake; fridge and Lab 207 records are retained. ${reviewCount} new records need review. Counts represent storage entries, not bottles or unique chemicals. Source names and review notes remain in Chinese.`
    : `更新于 2026-10-28：配体柜第1–5层、金属柜第1层采用新盘点；冰箱和207记录保留。新清单有 ${reviewCount} 条待核对。数量指存放位置记录，不代表药品种类或瓶数。`;
  const en = currentLang === 'en';
  const labels = {
    heroTitle: en ? 'Find a laboratory reagent' : '查找实验室试剂',
    heroDescription: en ? 'Search names, CAS numbers and storage columns. Open a record to see its source.' : '搜索名称、CAS 编号或存放列位，点击记录查看原始清单。',
    updateStamp: en ? 'Inventory updated · 2026.10.28' : '清单已更新 · 2026.10.28',
    totalLabel: en ? 'STORAGE RECORDS' : '全部位置记录',
    totalCaption: en ? 'Entries across all locations' : '按存放位置收录',
    locationsLabel: en ? 'STORAGE LOCATIONS' : '存放位置',
    locationsCaption: en ? 'Cabinets, fridge & Lab 207' : '柜层、冰箱与207实验室',
    newLabel: en ? 'NEW STOCKTAKE' : '本次盘点记录',
    newCaption: en ? '6 cabinet shelves updated' : '覆盖6个柜层',
    reviewLabel: en ? 'NEEDS REVIEW' : '新清单待核对',
    reviewCaption: en ? 'Open records for details' : '缺失字段或原表异常',
    searchHeading: en ? 'Reagent directory' : '检索药品',
  };
  Object.entries(labels).forEach(([id,value]) => document.getElementById(id).textContent=value);
  document.getElementById('totalMetric').textContent=drugs.length;
  document.getElementById('locationsMetric').textContent=new Set(drugs.map(d=>d.location)).size;
  document.getElementById('newMetric').textContent=drugs.filter(d=>d.source_file).length;
  document.getElementById('reviewMetric').textContent=reviewCount;
  document.getElementById('shortcutHint').innerHTML=(en ? 'Focus search' : '快速搜索') + '<kbd>Ctrl</kbd><kbd>K</kbd>';
  document.title = t.title;
  document.querySelector('h1').textContent = t.title;
  document.getElementById('searchInput').placeholder = t.searchPlaceholder;
  document.getElementById('resetBtn').textContent = t.reset;

  document.querySelectorAll('thead th').forEach(th => {
    const cn = th.getAttribute('data-cn');
    const en = th.getAttribute('data-en');
    if (cn && en) {
      const icon = th.querySelector('.sort-icon');
      th.childNodes.forEach(c => { if (c.nodeType === 3) c.remove(); });
      th.insertBefore(document.createTextNode(currentLang === 'en' ? en : cn), icon);
    }
  });

  // Update empty state
  const emptyP = document.querySelector('#emptyState p');
  if (emptyP) {
    const cn = emptyP.getAttribute('data-cn');
    const en = emptyP.getAttribute('data-en');
    if (cn && en) emptyP.textContent = currentLang === 'en' ? en : cn;
  }

  // Update location filter "all" option
  const allOpt = document.querySelector('#locationFilter option[value=""]');
  if (allOpt) allOpt.textContent = t.allLocations;
}

// ── Utils ──
function esc(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

// ── Boot ──
loadData();
</script>
