    const secondary=lang==='en'?(g.name_en?g.name:''):(g.name_en||'');
    const locs=uniqueLocations(g.matched);
    return '<article class="reagent-card"><div class="reagent-main"><div class="reagent-title-row"><button type="button" class="reagent-name" data-detail="'+g.id+'">'+esc(name)+'</button><button type="button" class="star-button'+(favorites.has(g.key)?' saved':'')+'" data-star="'+g.id+'" aria-pressed="'+favorites.has(g.key)+'" aria-label="'+esc(text(favorites.has(g.key)?'取消常用：':'标记常用：',favorites.has(g.key)?'Remove favorite: ':'Save favorite: ')+name)+'">'+(favorites.has(g.key)?'★':'☆')+'</button></div>'+
      (secondary?'<p class="secondary-name">'+esc(secondary)+'</p>':'')+
      '<div class="reagent-meta">'+(g.cas?'<button type="button" class="cas-button" data-copy-cas="'+g.id+'" aria-label="'+esc(text('复制CAS：','Copy CAS: ')+g.cas)+'"><span>CAS</span> '+esc(g.cas)+' <span aria-hidden="true">⧉</span></button>':'<span class="no-cas">'+text('CAS 未提供','CAS unavailable')+'</span>')+
      (g.matched.some(d=>d.check)?'<span class="label-check">'+text('请核对瓶签','Check bottle label')+'</span>':'')+'</div></div>'+
      '<div class="reagent-locations"><p class="location-caption">'+text('存放位置','LOCATION')+'</p><div class="location-pills">'+locs.map(d=>'<span class="location-pill"><span class="location-dot"></span><strong>'+esc(locText(d.location))+'</strong>'+(d.sublocation?'<span class="column-text">'+esc(columnText(d.sublocation))+'</span>':'')+'</span>').join('')+'</div></div>'+
      '<button type="button" class="detail-button" data-detail="'+g.id+'" aria-label="'+esc(text('查看全部位置：','View all locations: ')+name)+'"><span>'+text('查看','View')+'</span><span aria-hidden="true">↗</span></button></article>';
  }).join('');
  $('emptyState').hidden=n>0;
  $('emptyTitle').textContent=favoriteOnly?text('这里还没有匹配的常用药品','No matching favorites'):text('没有找到匹配的药品','No matching reagents');
  $('emptyDescription').textContent=favoriteOnly?text('点击药品旁的星标，便可在本浏览器快速找到它。','Use the star beside a reagent to save it in this browser.'):text('试试较短的名称、完整 CAS 号，或放宽位置筛选。','Try a shorter name, a complete CAS number, or a different location.');
  renderPagination();
}
function renderPagination() {
  const total=Math.ceil(visible.length/pageSize);
  if(total<=1){$('pagination').innerHTML='';return;}
  const nums=new Set([1,total,page-1,page,page+1].filter(n=>n>0&&n<=total));
  let last=0, html='<button type="button" data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>'+text('← 上一页','← Previous')+'</button>';
  for(const n of [...nums].sort((a,b)=>a-b)){
    if(last&&n-last>1)html+='<span class="page-gap">…</span>';
    html+='<button type="button" data-page="'+n+'" '+(n===page?'class="active" aria-current="page"':'')+'>'+n+'</button>';last=n;
  }
  html+='<button type="button" data-page="'+(page+1)+'" '+(page===total?'disabled':'')+'>'+text('下一页 →','Next →')+'</button>';
  $('pagination').innerHTML=html;
}
function updateLanguage() {
  document.documentElement.lang=lang==='cn'?'zh-CN':'en';
  document.title=text('药品查询 · 高俊阔课题组','Reagent Directory · Gao Research Group');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=words[lang][el.dataset.i18n]);
  $('heroHeading').innerHTML=text('实验室药品<span>查询与定位</span>','Laboratory reagents<span>Search & locate</span>');
  $('searchInput').placeholder=text('输入药品名称、英文名或 CAS 号…','Search name, English name or CAS number…');
  $('searchInput').setAttribute('aria-label',text('药品名称或CAS号','Reagent name or CAS number'));
  $('locationFilter').setAttribute('aria-label',text('具体柜层','Storage location'));
  $('columnFilter').setAttribute('aria-label',text('具体列位','Storage column'));
  $('languageButton').textContent=lang==='cn'?'EN':'中文';
  $('languageButton').setAttribute('aria-label',text('Switch to English','切换为中文'));
  $('modalClose').setAttribute('aria-label',text('关闭详情','Close details'));
  updateFilters(); refresh(false);
  if(activeGroupId!==null) renderDetail(activeGroupId);
}
function resetAll() {
  scope='all';favoriteOnly=false;page=1;
  $('searchInput').value='';$('locationFilter').value='';$('columnFilter').value='';$('sortSelect').value='relevance';
  updateFilters();refresh();
}
function toggleFavorite(id) {
  const g=groupsById.get(id);if(!g)return;
  favorites.has(g.key)?favorites.delete(g.key):favorites.add(g.key);
  try {localStorage.setItem(storageKey,JSON.stringify([...favorites]));}
  catch {notify(text('已标记；当前浏览器无法保存，下次打开可能丢失。','Marked for this session. Browser storage is unavailable.'));}
  refresh(false);
}
function notify(message) {
  clearTimeout(notify.timer);$('toast').textContent=message;$('toast').hidden=false;
  notify.timer=setTimeout(()=>$('toast').hidden=true,3000);
}
async function copyText(value) {
  try {await navigator.clipboard.writeText(value);notify(text('已复制','Copied'));}
  catch {notify(text('暂时无法自动复制，请长按或选中文字复制。','Copy unavailable. Select the text and copy it manually.'));}
}
function renderDetail(id) {
  const g=groupsById.get(id);if(!g)return;
  $('modalTitle').textContent=lang==='en'?(g.name_en||g.name):g.name;
  const locs=uniqueLocations(g.records);
  $('modalBody').innerHTML=(g.name_en?'<p class="detail-secondary">'+esc(lang==='cn'?g.name_en:g.name)+'</p>':'')+
    (g.cas?'<button class="cas-button detail-cas" type="button" data-copy-cas="'+g.id+'">CAS '+esc(g.cas)+' <span>'+text('复制','Copy')+'</span></button>':'')+
    (g.records.some(d=>d.check)?'<p class="detail-note">'+text('清单中的名称或编号有待确认，取用前请核对瓶身标签。','The recorded name or identifier needs confirmation. Check the bottle label before use.')+'</p>':'')+
    '<h3 class="detail-locations-title">'+text('全部存放位置','All storage locations')+' <span>'+locs.length+'</span></h3>'+
    '<div class="detail-locations">'+locs.map(d=>'<div class="detail-location"><div><strong>'+esc(locText(d.location))+'</strong><p>'+esc(d.sublocation?columnText(d.sublocation):text('未标注具体列位','Column not specified'))+'</p></div><button type="button" class="copy-location" data-copy-location="'+d.id+'">'+text('复制位置','Copy location')+'</button></div>').join('')+'</div>';
}
function showDetail(id) {
  if(!groupsById.has(id))return;
  previousFocus=document.activeElement;activeGroupId=id;renderDetail(id);
  $('modalOverlay').hidden=false;document.body.style.overflow='hidden';$('modalClose').focus();
}
function closeDetail() {
  $('modalOverlay').hidden=true;document.body.style.overflow='';activeGroupId=null;
  if(previousFocus?.isConnected)previousFocus.focus();
}
function handleResultClick(event) {
  const button=event.target.closest('button');
  if(!button)return;
  if(button.dataset.detail)showDetail(Number(button.dataset.detail));
  if(button.dataset.star)toggleFavorite(Number(button.dataset.star));
  if(button.dataset.copyCas){const g=groupsById.get(Number(button.dataset.copyCas));if(g)copyText(g.cas);}
  if(button.dataset.copyLocation){const d=DRUG_DATA.find(d=>d.id===Number(button.dataset.copyLocation));if(d)copyText(d.name+' · '+locationLabel(d)+(d.cas?' · CAS '+d.cas:''));}
}
$('searchInput').addEventListener('input',()=>refresh());
$('searchForm').addEventListener('submit',event=>{event.preventDefault();refresh();$('resultsTitle').scrollIntoView({behavior:'smooth',block:'center'});});
$('scopeTabs').addEventListener('click',event=>{const b=event.target.closest('[data-scope]');if(!b)return;scope=b.dataset.scope;$('locationFilter').value='';$('columnFilter').value='';updateFilters();refresh();});
$('favoriteFilter').addEventListener('click',()=>{favoriteOnly=!favoriteOnly;refresh();});
$('locationFilter').addEventListener('change',()=>{$('columnFilter').value='';updateFilters();refresh();});
$('columnFilter').addEventListener('change',()=>refresh());
$('sortSelect').addEventListener('change',()=>refresh());
$('resetButton').addEventListener('click',resetAll);$('emptyReset').addEventListener('click',resetAll);
$('results').addEventListener('click',handleResultClick);$('modalBody').addEventListener('click',handleResultClick);
$('pagination').addEventListener('click',event=>{const b=event.target.closest('[data-page]');if(!b||b.disabled)return;page=Number(b.dataset.page);refresh(false);$('resultsTitle').scrollIntoView({behavior:'smooth',block:'center'});});
$('languageButton').addEventListener('click',()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('gao-reagent-language',lang);}catch{}updateLanguage();});
$('modalClose').addEventListener('click',closeDetail);
$('modalOverlay').addEventListener('click',event=>{if(event.target===$('modalOverlay'))closeDetail();});
document.addEventListener('keydown',event=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(activeGroupId!==null)closeDetail();$('searchInput').focus();$('searchInput').select();}
  if(event.key==='Escape'&&activeGroupId!==null)closeDetail();
  if(event.key==='Tab'&&activeGroupId!==null){
    const nodes=$('detailDialog').querySelectorAll('button:not([disabled]),[href],input,select,[tabindex="0"]');
    const first=nodes[0],last=nodes[nodes.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
updateLanguage();

</script>
</body></html>
